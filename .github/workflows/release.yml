name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/cli/**'
      - 'registry/**'
      - '.changeset/**'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action writes ~/.npmrc from NPM_TOKEN if that file is missing.
      # A token-backed npmrc forces OTP (EOTP). Trusted publishing uses OIDC instead.
      - name: Use OIDC for npm publish
        run: printf 'registry=https://registry.npmjs.org/\n' > "$HOME/.npmrc"

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

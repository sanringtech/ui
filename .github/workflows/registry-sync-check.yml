name: Registry Sync Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/docs/src/app/navigation/docs-navigation.ts'
      - 'apps/docs/src/app/app.routes.ts'
      - 'apps/docs/src/app/pages/components/**'
      - 'packages/ui/src/lib/components/**'
      - 'packages/ui/src/public-api.ts'
      - 'registry/**'

jobs:
  check:
    name: Verify component is consistent across registry, packages/ui, public-api and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run registry sync check
        run: node packages/cli/scripts/check-registry-sync.mjs

      - name: Run registry parity check
        run: node packages/cli/scripts/check-registry-parity.mjs
